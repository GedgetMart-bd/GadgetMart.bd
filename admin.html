<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GadgetMart Admin Panel</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f6f8;
  color:#222;
}

/* LOGIN */

#loginPage{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:400px;
  background:white;
  padding:30px;
  border-radius:15px;
  box-shadow:0 5px 25px rgba(0,0,0,.12);
}

.login-box h1{
  text-align:center;
  margin-bottom:8px;
}

.login-box p{
  text-align:center;
  color:#777;
  margin-bottom:25px;
}

.login-box input{
  width:100%;
  padding:13px;
  margin-bottom:14px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px;
}

#loginBtn{
  width:100%;
  padding:13px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  font-size:16px;
}

#loginMessage{
  margin-top:15px;
  text-align:center;
  color:#dc2626;
  font-weight:bold;
}

/* ADMIN */

#adminPage{
  display:none;
}

header{
  background:#111827;
  color:white;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  font-size:22px;
}

.admin-email{
  font-size:13px;
  color:#ccc;
  margin-top:3px;
}

#logoutBtn{
  background:#dc2626;
  color:white;
  border:none;
  padding:9px 14px;
  border-radius:7px;
}

.container{
  max-width:900px;
  margin:25px auto;
  padding:15px;
}

.card{
  background:white;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card h2{
  margin-bottom:15px;
  font-size:20px;
}

input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px;
}

button{
  border:none;
  padding:11px 16px;
  border-radius:8px;
  cursor:pointer;
  font-size:15px;
}

#saveBtn{
  background:#16a34a;
  color:white;
}

#message{
  margin-top:10px;
  font-weight:bold;
}

.product{
  border:1px solid #eee;
  padding:15px;
  border-radius:10px;
  margin-bottom:12px;
}

.product h3{
  margin-bottom:8px;
}

.product p{
  margin:5px 0;
  color:#555;
}

.edit{
  background:#2563eb;
  color:white;
  margin-right:5px;
}

.delete{
  background:#dc2626;
  color:white;
}

.product img{
  width:100px;
  height:100px;
  object-fit:contain;
  background:#f5f5f5;
  border-radius:8px;
  margin-bottom:10px;
}

.stock{
  font-weight:bold;
  margin:8px 0;
}

.in-stock{
  color:#16a34a;
}

.out-stock{
  color:#dc2626;
}

@media(max-width:600px){

  header{
    padding:13px;
  }

  header h1{
    font-size:18px;
  }

  .container{
    margin:15px auto;
    padding:10px;
  }

}

</style>

</head>

<body>


<!-- LOGIN -->

<div id="loginPage">

  <div class="login-box">

    <h1>🔐 GadgetMart</h1>

    <p>Admin Panel Login</p>

    <input
      type="email"
      id="loginEmail"
      placeholder="Admin Email"
    >

    <input
      type="password"
      id="loginPassword"
      placeholder="Password"
    >

    <button id="loginBtn">
      Login
    </button>

    <div id="loginMessage"></div>

  </div>

</div>


<!-- ADMIN -->

<div id="adminPage">

<header>

  <div>

    <h1>🛒 GadgetMart Admin</h1>

    <div
      class="admin-email"
      id="adminEmail">
    </div>

  </div>

  <button id="logoutBtn">
    Logout
  </button>

</header>


<div class="container">


<!-- ADD PRODUCT -->

<div class="card">

  <h2>
    ➕ নতুন প্রোডাক্ট যোগ করুন
  </h2>

  <input
    type="text"
    id="name"
    placeholder="প্রোডাক্টের নাম"
  >

  <input
    type="number"
    id="price"
    placeholder="মূল দাম"
  >

  <input
    type="number"
    id="offerPrice"
    placeholder="অফার দাম"
  >

  <input
    type="number"
    id="stock"
    placeholder="স্টক সংখ্যা"
    min="0"
  >

  <input
    type="text"
    id="image"
    placeholder="ছবির লিংক"
  >

  <button id="saveBtn">
    প্রোডাক্ট সেভ করুন
  </button>

  <p id="message"></p>

</div>


<!-- PRODUCTS -->

<div class="card">

  <h2>
    📦 সব প্রোডাক্ট
  </h2>

  <div id="productList">
    লোড হচ্ছে...
  </div>

</div>

</div>

</div>


<script type="module">


/* FIREBASE */

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc,
  updateDoc
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


/* CONFIG */

const firebaseConfig = {

  apiKey:
  "AIzaSyCQIJ9c0AG0GCRE33EFYlkRitxz-rTpVMg",

  authDomain:
  "admin-4b12d.firebaseapp.com",

  projectId:
  "admin-4b12d",

  storageBucket:
  "admin-4b12d.firebasestorage.app",

  messagingSenderId:
  "669688260525",

  appId:
  "1:669688260525:web:8a27563fef2d42aec6a324",

  measurementId:
  "G-JMVF0XHN59"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);

const productCollection =
collection(db,"products");


/* ELEMENTS */

const loginPage =
document.getElementById("loginPage");

const adminPage =
document.getElementById("adminPage");

const loginEmail =
document.getElementById("loginEmail");

const loginPassword =
document.getElementById("loginPassword");

const loginBtn =
document.getElementById("loginBtn");

const loginMessage =
document.getElementById("loginMessage");

const logoutBtn =
document.getElementById("logoutBtn");

const adminEmail =
document.getElementById("adminEmail");

const nameInput =
document.getElementById("name");

const priceInput =
document.getElementById("price");

const offerPriceInput =
document.getElementById("offerPrice");

const stockInput =
document.getElementById("stock");

const imageInput =
document.getElementById("image");

const saveBtn =
document.getElementById("saveBtn");

const productList =
document.getElementById("productList");

const message =
document.getElementById("message");


let editId = null;


/* LOGIN */

loginBtn.addEventListener(
"click",
async()=>{

  const email =
  loginEmail.value.trim();

  const password =
  loginPassword.value;

  if(!email || !password){

    loginMessage.textContent =
    "⚠️ Email ও Password দিন";

    return;

  }

  loginBtn.disabled = true;

  loginBtn.textContent =
  "Login হচ্ছে...";

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    loginMessage.textContent = "";

  }

  catch(error){

    console.error(error);

    loginMessage.textContent =
    "❌ Email অথবা Password ভুল";

  }

  loginBtn.disabled = false;

  loginBtn.textContent =
  "Login";

});


/* ENTER */

loginPassword.addEventListener(
"keydown",
event=>{

  if(event.key==="Enter"){
    loginBtn.click();
  }

});


/* AUTH */

onAuthStateChanged(
auth,
user=>{

  if(user){

    loginPage.style.display =
    "none";

    adminPage.style.display =
    "block";

    adminEmail.textContent =
    user.email || "";

    loadProducts();

  }

  else{

    loginPage.style.display =
    "flex";

    adminPage.style.display =
    "none";

  }

});


/* LOGOUT */

logoutBtn.addEventListener(
"click",
async()=>{

  await signOut(auth);

});


/* SAVE */

saveBtn.addEventListener(
"click",
async()=>{

  const name =
  nameInput.value.trim();

  const price =
  Number(priceInput.value);

  const offerPrice =
  Number(offerPriceInput.value);

  const stock =
  Number(stockInput.value);

  const image =
  imageInput.value.trim();


  if(
    !name ||
    !price ||
    !offerPrice ||
    !image ||
    stock < 0 ||
    stockInput.value === ""
  ){

    message.textContent =
    "⚠️ সব তথ্য সঠিকভাবে পূরণ করুন";

    return;

  }


  try{

    if(editId){

      await updateDoc(

        doc(
          db,
          "products",
          editId
        ),

        {

          name:name,

          price:price,

          offerPrice:offerPrice,

          stock:stock,

          image:image

        }

      );

      message.textContent =
      "✅ প্রোডাক্ট আপডেট হয়েছে";

      editId = null;

      saveBtn.textContent =
      "প্রোডাক্ট সেভ করুন";

    }

    else{

      await addDoc(

        productCollection,

        {

          name:name,

          price:price,

          offerPrice:offerPrice,

          stock:stock,

          image:image,

          createdAt:Date.now()

        }

      );

      message.textContent =
      "✅ প্রোডাক্ট যোগ হয়েছে";

    }


    clearForm();

    loadProducts();

  }

  catch(error){

    console.error(error);

    message.textContent =
    "❌ সমস্যা হয়েছে: " +
    error.message;

  }

});


/* LOAD */

async function loadProducts(){

  productList.innerHTML =
  "লোড হচ্ছে...";

  try{

    const snapshot =
    await getDocs(
      productCollection
    );

    productList.innerHTML = "";


    if(snapshot.empty){

      productList.innerHTML =
      "কোনো প্রোডাক্ট পাওয়া যায়নি।";

      return;

    }


    snapshot.forEach(item=>{

      const data =
      item.data();

      const stock =
      Number(data.stock ?? 0);

      const div =
      document.createElement("div");

      div.className =
      "product";


      div.innerHTML = `

        <img
          src="${escapeHTML(
            data.image || ""
          )}"
          alt="Product"
        >

        <h3>
          ${escapeHTML(
            data.name || ""
          )}
        </h3>

        <p>
          মূল দাম:
          ৳${Number(
            data.price || 0
          )}
        </p>

        <p>
          অফার দাম:
          ৳${Number(
            data.offerPrice || 0
          )}
        </p>

        <p class="stock ${
          stock > 0
          ? "in-stock"
          : "out-stock"
        }">

          ${
            stock > 0
            ? "✅ স্টকে আছে: " + stock
            : "❌ Out of Stock"
          }

        </p>

        <button
          class="edit"
          data-id="${item.id}">
          ✏️ Edit
        </button>

        <button
          class="delete"
          data-id="${item.id}">
          🗑️ Delete
        </button>

      `;


      div
      .querySelector(".edit")
      .addEventListener(
        "click",
        ()=>{

          editProduct(

            item.id,

            data.name || "",

            data.price || "",

            data.offerPrice || "",

            stock,

            data.image || ""

          );

        }
      );


      div
      .querySelector(".delete")
      .addEventListener(
        "click",
        ()=>{

          deleteProduct(item.id);

        }
      );


      productList.appendChild(div);

    });

  }

  catch(error){

    console.error(error);

    productList.innerHTML =
    "❌ ডাটা লোড করা যায়নি";

  }

}


/* EDIT */

function editProduct(
  id,
  name,
  price,
  offerPrice,
  stock,
  image
){

  editId = id;

  nameInput.value =
  name;

  priceInput.value =
  price;

  offerPriceInput.value =
  offerPrice;

  stockInput.value =
  stock;

  imageInput.value =
  image;

  saveBtn.textContent =
  "✏️ প্রোডাক্ট আপডেট করুন";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* DELETE */

async function deleteProduct(id){

  const ok =
  confirm(
    "এই প্রোডাক্টটি ডিলিট করতে চান?"
  );

  if(!ok) return;


  try{

    await deleteDoc(
      doc(
        db,
        "products",
        id
      )
    );

    message.textContent =
    "🗑️ প্রোডাক্ট ডিলিট হয়েছে";

    loadProducts();

  }

  catch(error){

    console.error(error);

    message.textContent =
    "❌ ডিলিট করা যায়নি";

  }

}


/* CLEAR */

function clearForm(){

  nameInput.value = "";

  priceInput.value = "";

  offerPriceInput.value = "";

  stockInput.value = "";

  imageInput.value = "";

}


/* ESCAPE */

function escapeHTML(value){

  return String(value)

  .replaceAll("&","&amp;")

  .replaceAll("<","&lt;")

  .replaceAll(">","&gt;")

  .replaceAll('"',"&quot;")

  .replaceAll("'","&#039;");

}

</script>

</body>
</html>
