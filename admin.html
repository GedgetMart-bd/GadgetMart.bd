<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GadgetMart Admin Panel</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#f4f6f8;
      color:#222;
    }

    header{
      background:#111827;
      color:white;
      padding:18px;
      text-align:center;
    }

    header h1{
      font-size:24px;
    }

    .container{
      max-width:900px;
      margin:25px auto;
      padding:15px;
    }

    .card{
      background:white;
      padding:20px;
      border-radius:12px;
      margin-bottom:20px;
      box-shadow:0 3px 12px rgba(0,0,0,.08);
    }

    .card h2{
      margin-bottom:15px;
      font-size:20px;
    }

    input{
      width:100%;
      padding:12px;
      margin-bottom:12px;
      border:1px solid #ddd;
      border-radius:8px;
      font-size:15px;
    }

    button{
      border:none;
      padding:11px 16px;
      border-radius:8px;
      cursor:pointer;
      font-size:15px;
      margin-right:5px;
    }

    #saveBtn{
      background:#16a34a;
      color:white;
    }

    .product{
      border:1px solid #eee;
      padding:15px;
      border-radius:10px;
      margin-bottom:12px;
    }

    .product h3{
      margin-bottom:8px;
    }

    .product p{
      margin:5px 0;
      color:#555;
    }

    .edit{
      background:#2563eb;
      color:white;
    }

    .delete{
      background:#dc2626;
      color:white;
    }

    #message{
      margin-top:10px;
      font-weight:bold;
    }
  </style>
</head>

<body>

<header>
  <h1>🛒 GadgetMart Admin Panel</h1>
</header>

<div class="container">

  <!-- Add Product -->
  <div class="card">

    <h2>➕ নতুন প্রোডাক্ট যোগ করুন</h2>

    <input
      type="text"
      id="name"
      placeholder="প্রোডাক্টের নাম"
    >

    <input
      type="number"
      id="price"
      placeholder="মূল দাম"
    >

    <input
      type="number"
      id="offerPrice"
      placeholder="অফার দাম"
    >

    <input
      type="text"
      id="image"
      placeholder="ছবির লিংক"
    >

    <button id="saveBtn">
      প্রোডাক্ট সেভ করুন
    </button>

    <p id="message"></p>

  </div>


  <!-- Product List -->

  <div class="card">

    <h2>📦 সব প্রোডাক্ট</h2>

    <div id="productList">
      লোড হচ্ছে...
    </div>

  </div>

</div>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    updateDoc
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


  // Firebase Configuration

  const firebaseConfig = {

    apiKey: "AIzaSyCQIJ9c0AG0GCRE33EFYlkRitxz-rTpVMg",

    authDomain: "admin-4b12d.firebaseapp.com",

    projectId: "admin-4b12d",

    storageBucket: "admin-4b12d.firebasestorage.app",

    messagingSenderId: "669688260525",

    appId: "1:669688260525:web:8a27563fef2d42aec6a324",

    measurementId: "G-JMVF0XHN59"

  };


  // Initialize Firebase

  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);


  const productCollection =
    collection(db, "products");


  const nameInput =
    document.getElementById("name");

  const priceInput =
    document.getElementById("price");

  const offerPriceInput =
    document.getElementById("offerPrice");

  const imageInput =
    document.getElementById("image");

  const saveBtn =
    document.getElementById("saveBtn");

  const productList =
    document.getElementById("productList");

  const message =
    document.getElementById("message");


  let editId = null;


  // =========================
  // SAVE PRODUCT
  // =========================

  saveBtn.addEventListener("click", async () => {

    const name =
      nameInput.value.trim();

    const price =
      priceInput.value;

    const offerPrice =
      offerPriceInput.value;

    const image =
      imageInput.value.trim();


    if(!name || !price || !offerPrice || !image){

      message.textContent =
        "⚠️ সব তথ্য পূরণ করুন";

      return;
    }


    try{

      if(editId){

        await updateDoc(
          doc(db, "products", editId),
          {
            name:name,
            price:Number(price),
            offerPrice:Number(offerPrice),
            image:image
          }
        );

        message.textContent =
          "✅ প্রোডাক্ট আপডেট হয়েছে";

        editId = null;

        saveBtn.textContent =
          "প্রোডাক্ট সেভ করুন";

      }else{

        await addDoc(
          productCollection,
          {
            name:name,
            price:Number(price),
            offerPrice:Number(offerPrice),
            image:image,
            createdAt:Date.now()
          }
        );

        message.textContent =
          "✅ প্রোডাক্ট যোগ হয়েছে";

      }


      clearForm();

      loadProducts();

    }catch(error){

      console.error(error);

      message.textContent =
        "❌ সমস্যা হয়েছে: " + error.message;

    }

  });


  // =========================
  // LOAD PRODUCTS
  // =========================

  async function loadProducts(){

    productList.innerHTML =
      "লোড হচ্ছে...";


    try{

      const snapshot =
        await getDocs(productCollection);


      productList.innerHTML = "";


      if(snapshot.empty){

        productList.innerHTML =
          "কোনো প্রোডাক্ট পাওয়া যায়নি।";

        return;

      }


      snapshot.forEach((item) => {

        const data =
          item.data();


        const div =
          document.createElement("div");

        div.className =
          "product";


        div.innerHTML = `

          <h3>${data.name}</h3>

          <p>
            মূল দাম:
            ৳${data.price}
          </p>

          <p>
            অফার দাম:
            ৳${data.offerPrice}
          </p>

          <button
            class="edit"
            onclick="editProduct('${item.id}',
            '${data.name}',
            '${data.price}',
            '${data.offerPrice}',
            '${data.image}')">
            ✏️ Edit
          </button>

          <button
            class="delete"
            onclick="deleteProduct('${item.id}')">
            🗑️ Delete
          </button>

        `;


        productList.appendChild(div);

      });


    }catch(error){

      console.error(error);

      productList.innerHTML =
        "❌ ডাটা লোড করা যায়নি";

    }

  }


  // =========================
  // EDIT PRODUCT
  // =========================

  window.editProduct =
  function(id,name,price,offerPrice,image){

    editId = id;

    nameInput.value = name;

    priceInput.value = price;

    offerPriceInput.value = offerPrice;

    imageInput.value = image;

    saveBtn.textContent =
      "✏️ প্রোডাক্ট আপডেট করুন";

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  };


  // =========================
  // DELETE PRODUCT
  // =========================

  window.deleteProduct =
  async function(id){

    const confirmDelete =
      confirm(
        "এই প্রোডাক্টটি ডিলিট করতে চান?"
      );


    if(!confirmDelete) return;


    try{

      await deleteDoc(
        doc(db,"products",id)
      );


      message.textContent =
        "🗑️ প্রোডাক্ট ডিলিট হয়েছে";


      loadProducts();


    }catch(error){

      console.error(error);

      message.textContent =
        "❌ ডিলিট করা যায়নি";

    }

  };


  // =========================
  // CLEAR FORM
  // =========================

  function clearForm(){

    nameInput.value = "";

    priceInput.value = "";

    offerPriceInput.value = "";

    imageInput.value = "";

  }


  // প্রথমবার প্রোডাক্ট লোড

  loadProducts();

</script>

</body>
</html>
