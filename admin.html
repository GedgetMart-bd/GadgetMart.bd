<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>GadgetMart Admin Panel</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f8;
color:#222;
}

#loginPage{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
background:#f4f6f8;
}

.login-box{
width:100%;
max-width:400px;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 25px rgba(0,0,0,.12);
}

.login-box h1{
text-align:center;
margin-bottom:8px;
color:#111827;
}

.login-box p{
text-align:center;
color:#777;
margin-bottom:25px;
}

.login-box input{
width:100%;
padding:13px;
margin-bottom:14px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;
outline:none;
}

#loginBtn{
width:100%;
padding:13px;
border:none;
border-radius:8px;
background:#2563eb;
color:white;
font-size:16px;
cursor:pointer;
}

#loginBtn:disabled{
opacity:.6;
}

#loginMessage{
margin-top:15px;
text-align:center;
font-weight:bold;
color:#dc2626;
}

#adminPage{
display:none;
}

header{
background:#111827;
color:white;
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

header h1{
font-size:22px;
}

#logoutBtn{
background:#dc2626;
color:white;
border:none;
padding:9px 14px;
border-radius:7px;
cursor:pointer;
}

.container{
max-width:900px;
margin:25px auto;
padding:15px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card h2{
margin-bottom:15px;
font-size:20px;
}

input,
select{
width:100%;
padding:12px;
margin-bottom:12px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;
}

button{
border:none;
padding:11px 16px;
border-radius:8px;
cursor:pointer;
font-size:15px;
margin-right:5px;
}

#saveBtn{
background:#16a34a;
color:white;
}

#cancelBtn{
background:#6b7280;
color:white;
display:none;
}

.product{
border:1px solid #eee;
padding:15px;
border-radius:10px;
margin-bottom:12px;
}

.product h3{
margin-bottom:8px;
}

.product p{
margin:5px 0;
color:#555;
}

.product img{
width:100px;
height:100px;
object-fit:contain;
background:#f5f5f5;
border-radius:8px;
margin:8px 0;
}

.edit{
background:#2563eb;
color:white;
}

.delete{
background:#dc2626;
color:white;
}

#message{
margin-top:10px;
font-weight:bold;
}

.admin-email{
font-size:13px;
color:#ddd;
margin-top:3px;
}

@media(max-width:600px){

header{
padding:13px;
}

header h1{
font-size:18px;
}

#logoutBtn{
padding:8px 10px;
font-size:13px;
}

.container{
margin:15px auto;
padding:10px;
}

}

</style>

</head>

<body>


<!-- LOGIN -->

<div id="loginPage">

<div class="login-box">

<h1>🔐 GadgetMart</h1>

<p>Admin Panel Login</p>

<input
type="email"
id="loginEmail"
placeholder="Admin Email"
autocomplete="email">

<input
type="password"
id="loginPassword"
placeholder="Password"
autocomplete="current-password">

<button id="loginBtn">
Login
</button>

<div id="loginMessage"></div>

</div>

</div>


<!-- ADMIN -->

<div id="adminPage">

<header>

<div>

<h1>
🛒 GadgetMart Admin
</h1>

<div
class="admin-email"
id="adminEmail">
</div>

</div>

<button id="logoutBtn">
Logout
</button>

</header>


<div class="container">


<!-- ADD PRODUCT -->

<div class="card">

<h2>
➕ নতুন প্রোডাক্ট যোগ করুন
</h2>


<input
type="text"
id="name"
placeholder="প্রোডাক্টের নাম">


<input
type="number"
id="price"
placeholder="মূল দাম">


<input
type="number"
id="offerPrice"
placeholder="অফার দাম">


<select id="category">

<option value="">
Category নির্বাচন করুন
</option>

<option value="Smart Watch">
Smart Watch
</option>

<option value="Audio">
Audio
</option>

<option value="Speaker">
Speaker
</option>

<option value="Power Bank">
Power Bank
</option>

<option value="Accessories">
Accessories
</option>

</select>


<input
type="number"
id="stock"
placeholder="স্টক সংখ্যা">


<input
type="text"
id="badge"
placeholder="Badge যেমন HOT / SALE / NEW">


<input
type="text"
id="image"
placeholder="ছবির লিংক">


<button id="saveBtn">
প্রোডাক্ট সেভ করুন
</button>


<button
id="cancelBtn">
Cancel
</button>


<p id="message"></p>

</div>


<!-- PRODUCT LIST -->

<div class="card">

<h2>
📦 সব প্রোডাক্ট
</h2>

<div id="productList">
লোড হচ্ছে...
</div>

</div>

</div>

</div>


<script type="module">


/* =========================
   FIREBASE
========================= */

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
updateDoc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


/* =========================
   CONFIG
========================= */

const firebaseConfig = {

apiKey:
"AIzaSyCQIJ9c0AG0GCRE33EFYlkRitxz-rTpVMg",

authDomain:
"admin-4b12d.firebaseapp.com",

projectId:
"admin-4b12d",

storageBucket:
"admin-4b12d.firebasestorage.app",

messagingSenderId:
"669688260525",

appId:
"1:669688260525:web:8a27563fef2d42aec6a324",

measurementId:
"G-JMVF0XHN59"

};


/* =========================
   INIT
========================= */

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);

const productCollection =
collection(db,"products");


/* =========================
   ELEMENTS
========================= */

const loginPage =
document.getElementById("loginPage");

const adminPage =
document.getElementById("adminPage");

const loginEmail =
document.getElementById("loginEmail");

const loginPassword =
document.getElementById("loginPassword");

const loginBtn =
document.getElementById("loginBtn");

const loginMessage =
document.getElementById("loginMessage");

const logoutBtn =
document.getElementById("logoutBtn");

const adminEmail =
document.getElementById("adminEmail");

const nameInput =
document.getElementById("name");

const priceInput =
document.getElementById("price");

const offerPriceInput =
document.getElementById("offerPrice");

const categoryInput =
document.getElementById("category");

const stockInput =
document.getElementById("stock");

const badgeInput =
document.getElementById("badge");

const imageInput =
document.getElementById("image");

const saveBtn =
document.getElementById("saveBtn");

const cancelBtn =
document.getElementById("cancelBtn");

const productList =
document.getElementById("productList");

const message =
document.getElementById("message");


let editId = null;


/* =========================
   LOGIN
========================= */

loginBtn.addEventListener(
"click",
async()=>{

const email =
loginEmail.value.trim();

const password =
loginPassword.value;


if(!email || !password){

loginMessage.textContent =
"⚠️ Email ও Password দিন";

return;

}


loginBtn.disabled=true;

loginBtn.textContent =
"Login হচ্ছে...";


try{

await signInWithEmailAndPassword(
auth,
email,
password
);

loginMessage.textContent="";

}catch(error){

console.error(error);

if(
error.code===
"auth/invalid-credential"
){

loginMessage.textContent =
"❌ Email অথবা Password ভুল";

}else{

loginMessage.textContent =
"❌ Login করা যায়নি";

}

}


loginBtn.disabled=false;

loginBtn.textContent="Login";

});


/* =========================
   ENTER LOGIN
========================= */

loginPassword.addEventListener(
"keydown",
(event)=>{

if(event.key==="Enter"){

loginBtn.click();

}

});


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
auth,
(user)=>{

if(user){

loginPage.style.display="none";

adminPage.style.display="block";

adminEmail.textContent =
user.email || "";

loadProducts();

}else{

loginPage.style.display="flex";

adminPage.style.display="none";

}

});


/* =========================
   LOGOUT
========================= */

logoutBtn.addEventListener(
"click",
async()=>{

try{

await signOut(auth);

}catch(error){

console.error(error);

}

});


/* =========================
   SAVE PRODUCT
========================= */

saveBtn.addEventListener(
"click",
async()=>{

const name =
nameInput.value.trim();

const price =
Number(priceInput.value);

const offerPrice =
Number(offerPriceInput.value);

const category =
categoryInput.value;

const stock =
Number(stockInput.value);

const badge =
badgeInput.value.trim();

const image =
imageInput.value.trim();


if(
!name ||
!price ||
!offerPrice ||
!category ||
!image
){

message.textContent =
"⚠️ প্রয়োজনীয় সব তথ্য পূরণ করুন";

return;

}


try{


/* EDIT */

if(editId){

await updateDoc(

doc(
db,
"products",
editId
),

{

name:name,

price:price,

offerPrice:offerPrice,

category:category,

stock:stock,

badge:badge,

image:image,

updatedAt:Date.now()

}

);


message.textContent =
"✅ প্রোডাক্ট আপডেট হয়েছে";


editId=null;

saveBtn.textContent =
"প্রোডাক্ট সেভ করুন";

cancelBtn.style.display =
"none";


}else{


/* ADD */

await addDoc(

productCollection,

{

name:name,

price:price,

offerPrice:offerPrice,

category:category,

stock:stock,

badge:badge,

image:image,

createdAt:Date.now()

}

);


message.textContent =
"✅ প্রোডাক্ট যোগ হয়েছে";

}


clearForm();

loadProducts();


}catch(error){

console.error(error);

message.textContent =
"❌ সমস্যা হয়েছে: "+
error.message;

}

});


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

productList.innerHTML =
"লোড হচ্ছে...";


try{

const snapshot =
await getDocs(
productCollection
);


productList.innerHTML="";


if(snapshot.empty){

productList.innerHTML =
"কোনো প্রোডাক্ট পাওয়া যায়নি।";

return;

}


snapshot.forEach(
(item)=>{

const data =
item.data();


const div =
document.createElement("div");


div.className="product";


div.innerHTML=`

<h3>
${escapeHTML(data.name || "")}
</h3>

<img
src="${escapeHTML(data.image || "")}"
onerror="
this.src='https://via.placeholder.com/100'
">

<p>
মূল দাম:
৳${Number(data.price || 0)}
</p>

<p>
অফার দাম:
৳${Number(data.offerPrice || 0)}
</p>

<p>
Category:
${escapeHTML(data.category || "")}
</p>

<p>
Stock:
${Number(data.stock || 0)}
</p>

<p>
Badge:
${escapeHTML(data.badge || "নেই")}
</p>

<button
class="edit">
✏️ Edit
</button>

<button
class="delete">
🗑️ Delete
</button>

`;


const editButton =
div.querySelector(".edit");

const deleteButton =
div.querySelector(".delete");


editButton.addEventListener(
"click",
()=>{

editProduct(
item.id,
data
);

});


deleteButton.addEventListener(
"click",
()=>{

deleteProduct(item.id);

});


productList.appendChild(div);

});

}catch(error){

console.error(error);

productList.innerHTML =
"❌ ডাটা লোড করা যায়নি";

}

}


/* =========================
   EDIT
========================= */

function editProduct(
id,
data
){

editId=id;

nameInput.value =
data.name || "";

priceInput.value =
data.price || "";

offerPriceInput.value =
data.offerPrice || "";

categoryInput.value =
data.category || "";

stockInput.value =
data.stock || "";

badgeInput.value =
data.badge || "";

imageInput.value =
data.image || "";


saveBtn.textContent =
"✏️ প্রোডাক্ট আপডেট করুন";

cancelBtn.style.display =
"inline-block";


message.textContent =
"✏️ Edit mode চালু হয়েছে";


window.scrollTo({

top:0,

behavior:"smooth"

});

}


/* =========================
   CANCEL EDIT
========================= */

cancelBtn.addEventListener(
"click",
()=>{

editId=null;

clearForm();

saveBtn.textContent =
"প্রোডাক্ট সেভ করুন";

cancelBtn.style.display =
"none";

message.textContent="";

});


/* =========================
   DELETE
========================= */

async function deleteProduct(id){

const confirmDelete =
confirm(
"এই প্রোডাক্টটি ডিলিট করতে চান?"
);


if(!confirmDelete){

return;

}


try{

await deleteDoc(
doc(
db,
"products",
id
)
);


message.textContent =
"🗑️ প্রোডাক্ট ডিলিট হয়েছে";

loadProducts();


}catch(error){

console.error(error);

message.textContent =
"❌ ডিলিট করা যায়নি";

}

}


/* =========================
   CLEAR
========================= */

function clearForm(){

nameInput.value="";

priceInput.value="";

offerPriceInput.value="";

categoryInput.value="";

stockInput.value="";

badgeInput.value="";

imageInput.value="";

}


/* =========================
   SECURITY
========================= */

function escapeHTML(value){

return String(value)

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;")

.replaceAll("'","&#039;");

}

</script>

</body>

</html>
