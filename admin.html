<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GadgetMart Admin Panel</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f6f9;
  color:#222;
}

/* LOGIN */
#loginPage{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.login{
  width:100%;
  max-width:380px;
  background:white;
  padding:30px;
  border-radius:18px;
  box-shadow:0 8px 30px rgba(0,0,0,.12);
}

.logo{
  text-align:center;
  font-size:26px;
  font-weight:bold;
  margin-bottom:25px;
}

.login input{
  width:100%;
  padding:14px;
  margin-bottom:15px;
  border:1px solid #ddd;
  border-radius:9px;
  font-size:16px;
}

button{
  border:0;
  border-radius:9px;
  padding:13px 18px;
  background:#111;
  color:white;
  font-size:15px;
  cursor:pointer;
}

.login button{
  width:100%;
}

#error{
  color:red;
  text-align:center;
  margin-top:12px;
  display:none;
}

/* ADMIN */
#adminPage{
  display:none;
}

header{
  background:#111;
  color:white;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h2{
  font-size:20px;
}

.logout{
  background:#e53935;
  padding:9px 14px;
}

.container{
  padding:20px;
  max-width:1100px;
  margin:auto;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:white;
  padding:20px;
  border-radius:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.stat h3{
  font-size:14px;
  color:#777;
  margin-bottom:8px;
}

.stat p{
  font-size:28px;
  font-weight:bold;
}

.section{
  background:white;
  padding:20px;
  border-radius:14px;
  margin-bottom:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.section h2{
  margin-bottom:18px;
}

.form{
  display:grid;
  gap:12px;
}

.form input,
.form textarea{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px;
}

.form textarea{
  min-height:90px;
  resize:vertical;
}

.products{
  display:grid;
  gap:12px;
}

.product{
  border:1px solid #eee;
  padding:15px;
  border-radius:10px;
}

.product h3{
  margin-bottom:6px;
}

.product p{
  color:#666;
  margin-bottom:10px;
}

.delete{
  background:#e53935;
}

@media(max-width:700px){
  .stats{
    grid-template-columns:1fr;
  }

  header{
    padding:15px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">

  <div class="login">

    <div class="logo">
      GadgetMart Admin
    </div>

    <input
      type="text"
      id="username"
      placeholder="ইউজারনেম"
    >

    <input
      type="password"
      id="password"
      placeholder="পাসওয়ার্ড"
    >

    <button onclick="login()">
      লগইন
    </button>

    <p id="error">
      ইউজারনেম অথবা পাসওয়ার্ড ভুল!
    </p>

  </div>

</div>


<!-- ADMIN PANEL -->
<div id="adminPage">

  <header>

    <h2>GadgetMart Admin</h2>

    <button class="logout" onclick="logout()">
      লগআউট
    </button>

  </header>


  <div class="container">

    <!-- STATS -->
    <div class="stats">

      <div class="stat">
        <h3>মোট প্রোডাক্ট</h3>
        <p id="totalProducts">0</p>
      </div>

      <div class="stat">
        <h3>মোট অর্ডার</h3>
        <p>0</p>
      </div>

      <div class="stat">
        <h3>মোট বিক্রি</h3>
        <p>৳0</p>
      </div>

    </div>


    <!-- ADD PRODUCT -->
    <div class="section">

      <h2>নতুন প্রোডাক্ট যোগ করুন</h2>

      <div class="form">

        <input
          type="text"
          id="productName"
          placeholder="প্রোডাক্টের নাম"
        >

        <input
          type="number"
          id="productPrice"
          placeholder="মূল দাম"
        >

        <input
          type="number"
          id="productOffer"
          placeholder="অফার দাম"
        >

        <input
          type="text"
          id="productImage"
          placeholder="ছবির লিংক"
        >

        <textarea
          id="productDescription"
          placeholder="প্রোডাক্টের বিবরণ"
        ></textarea>

        <button onclick="addProduct()">
          + প্রোডাক্ট যোগ করুন
        </button>

      </div>

    </div>


    <!-- PRODUCT LIST -->
    <div class="section">

      <h2>প্রোডাক্ট তালিকা</h2>

      <div
        class="products"
        id="productList"
      ></div>

    </div>

  </div>

</div>


<script>

/* LOGIN */

function login(){

  const username =
    document.getElementById("username").value;

  const password =
    document.getElementById("password").value;

  if(username === "admin" && password === "1234"){

    document.getElementById("loginPage").style.display="none";

    document.getElementById("adminPage").style.display="block";

    loadProducts();

  }else{

    document.getElementById("error").style.display="block";

  }

}


/* LOGOUT */

function logout(){

  document.getElementById("adminPage").style.display="none";

  document.getElementById("loginPage").style.display="flex";

}


/* ADD PRODUCT */

function addProduct(){

  const name =
    document.getElementById("productName").value;

  const price =
    document.getElementById("productPrice").value;

  const offer =
    document.getElementById("productOffer").value;

  const image =
    document.getElementById("productImage").value;

  const description =
    document.getElementById("productDescription").value;


  if(!name || !price){

    alert("প্রোডাক্টের নাম ও দাম দিন");

    return;

  }


  const product = {

    id:Date.now(),

    name:name,

    price:price,

    offer:offer,

    image:image,

    description:description

  };


  let products =
    JSON.parse(localStorage.getItem("products")) || [];


  products.push(product);


  localStorage.setItem(
    "products",
    JSON.stringify(products)
  );


  document.getElementById("productName").value="";

  document.getElementById("productPrice").value="";

  document.getElementById("productOffer").value="";

  document.getElementById("productImage").value="";

  document.getElementById("productDescription").value="";


  loadProducts();

}


/* LOAD PRODUCTS */

function loadProducts(){

  const list =
    document.getElementById("productList");

  let products =
    JSON.parse(localStorage.getItem("products")) || [];


  document.getElementById("totalProducts").innerText =
    products.length;


  list.innerHTML="";


  if(products.length === 0){

    list.innerHTML =
      "<p>এখনো কোনো প্রোডাক্ট যোগ করা হয়নি।</p>";

    return;

  }


  products.forEach(function(product){

    const div =
      document.createElement("div");

    div.className="product";


    div.innerHTML=`

      <h3>${product.name}</h3>

      <p>
        মূল দাম: ৳${product.price}
        <br>
        অফার দাম: ৳${product.offer || "নেই"}
      </p>

      <button
        class="delete"
        onclick="deleteProduct(${product.id})"
      >
        ডিলিট
      </button>

    `;


    list.appendChild(div);

  });

}


/* DELETE PRODUCT */

function deleteProduct(id){

  let products =
    JSON.parse(localStorage.getItem("products")) || [];


  products =
    products.filter(function(product){

      return product.id !== id;

    });


  localStorage.setItem(
    "products",
    JSON.stringify(products)
  );


  loadProducts();

}

</script>

</body>
</html>
