<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyCQIJ9c0AG0GCRE33EFYlkRitxz-rTpVMg",

  authDomain:
    "admin-4b12d.firebaseapp.com",

  projectId:
    "admin-4b12d",

  storageBucket:
    "admin-4b12d.firebasestorage.app",

  messagingSenderId:
    "669688260525",

  appId:
    "1:669688260525:web:8a27563fef2d42aec6a324"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* =========================
   GLOBAL DATA
========================= */

let productsList = [];

let categoriesList = [];

let cart = [];


/* =========================
   LOAD CATEGORIES
========================= */

async function loadCategories(){

  try{

    const snapshot =
      await getDocs(
        collection(db,"categories")
      );


    categoriesList = [];


    snapshot.forEach(doc => {

      const data = doc.data();


      if(data.active !== false){

        categoriesList.push({

          id: doc.id,

          name:
            data.name || "Category",

          icon:
            data.icon || "📦"

        });

      }

    });


    renderCategories();


  }catch(error){

    console.error(
      "Category Load Error:",
      error
    );

  }

}


/* =========================
   RENDER CATEGORIES
========================= */

function renderCategories(){

  const categoryGrid =
    document.querySelector(
      ".category-grid"
    );


  if(!categoryGrid){

    return;

  }


  let html = `

    <div
      class="category-card"
      onclick="filterCategory('all')"
    >

      <div class="category-icon">
        🛍️
      </div>

      <div class="category-name">
        All
      </div>

    </div>

  `;


  categoriesList.forEach(category => {

    html += `

      <div
        class="category-card"
        onclick="filterCategory('${escapeAttribute(category.name)}')"
      >

        <div class="category-icon">
          ${escapeHTML(category.icon)}
        </div>

        <div class="category-name">
          ${escapeHTML(category.name)}
        </div>

      </div>

    `;

  });


  categoryGrid.innerHTML =
    html;

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

  try{

    const snapshot =
      await getDocs(
        collection(db,"products")
      );


    productsList = [];


    snapshot.forEach(doc => {

      const data =
        doc.data();


      productsList.push({

        id: doc.id,

        name:
          data.name || "Unnamed Product",

        category:
          data.category || "Accessories",

        price:
          Number(
            data.offerPrice ??
            data.price ??
            0
          ),

        oldPrice:
          Number(
            data.price ??
            0
          ),

        stock:
          Number(
            data.stock ??
            0
          ),

        badge:
          data.badge || "",

        image:
          data.image || ""

      });

    });


    renderProducts();


  }catch(error){

    console.error(
      "Product Load Error:",
      error
    );

  }

}


/* =========================
   RENDER PRODUCTS
========================= */

function renderProducts(
  products = productsList
){

  const grid =
    document.getElementById(
      "productGrid"
    );


  if(!grid){

    return;

  }


  if(products.length === 0){

    grid.innerHTML = `

      <p style="
        grid-column:1/-1;
        text-align:center;
        padding:30px;
        color:#777;
      ">

        কোনো Product পাওয়া যায়নি

      </p>

    `;

    return;

  }


  grid.innerHTML =

    products.map(product => `

      <div class="product-card">

        <div class="product-image-wrap">

          ${
            product.badge
            ?
            `
              <span class="badge">
                ${escapeHTML(product.badge)}
              </span>
            `
            :
            ""
          }

          <img
            class="product-image"
            src="${escapeAttribute(product.image)}"
            alt="${escapeAttribute(product.name)}"
          >

        </div>


        <div class="product-content">

          <div class="product-category">

            ${escapeHTML(product.category)}

          </div>


          <div class="product-name">

            ${escapeHTML(product.name)}

          </div>


          <div class="price-row">

            <span class="price">

              ৳${product.price}

            </span>


            ${
              product.oldPrice > product.price
              ?
              `
                <span class="old-price">

                  ৳${product.oldPrice}

                </span>
              `
              :
              ""
            }

          </div>


          <div class="stock">

            ${
              product.stock > 0
              ?
              `স্টকে আছে: ${product.stock}`
              :
              `Out of Stock`
            }

          </div>


          <button
            class="add-cart"
            onclick="addToCart('${product.id}')"
            ${product.stock <= 0 ? "disabled" : ""}
          >

            ${
              product.stock > 0
              ?
              "Add To Cart"
              :
              "Out of Stock"
            }

          </button>

        </div>

      </div>

    `).join("");

}


/* =========================
   CATEGORY FILTER
========================= */

window.filterCategory =
function(category){

  if(category === "all"){

    renderProducts(
      productsList
    );

  }else{

    const filtered =
      productsList.filter(
        product =>
          product.category
            .toLowerCase()
            ===
          category.toLowerCase()
      );


    renderProducts(
      filtered
    );

  }


  scrollToSection(
    "products"
  );

};


/* =========================
   SEARCH
========================= */

window.searchProducts =
function(){

  const input =
    document.getElementById(
      "searchInput"
    );


  const keyword =
    input.value
      .toLowerCase()
      .trim();


  const filtered =
    productsList.filter(
      product =>

        product.name
          .toLowerCase()
          .includes(keyword)

        ||

        product.category
          .toLowerCase()
          .includes(keyword)
    );


  renderProducts(
    filtered
  );

};


/* =========================
   SCROLL
========================= */

window.scrollToSection =
function(id){

  document
    .getElementById(id)
    ?.scrollIntoView({

      behavior:"smooth"

    });

};


/* =========================
   ADD TO CART
========================= */

window.addToCart =
function(productId){

  const product =
    productsList.find(
      item =>
        item.id === productId
    );


  if(!product){

    return;

  }


  if(product.stock <= 0){

    showToast(
      "এই Product এখন Out of Stock"
    );

    return;

  }


  const existing =
    cart.find(
      item =>
        item.id === productId
    );


  if(existing){

    if(
      existing.qty >=
      product.stock
    ){

      showToast(
        "এর বেশি Stock নেই"
      );

      return;

    }


    existing.qty++;

  }else{

    cart.push({

      ...product,

      qty:1

    });

  }


  renderCart();


  showToast(
    "Product Cart-এ যোগ হয়েছে 🛒"
  );

};


/* =========================
   CART
========================= */

function renderCart(){

  const container =
    document.getElementById(
      "cartItems"
    );

  const count =
    document.getElementById(
      "cartCount"
    );


  if(!container || !count){

    return;

  }


  if(cart.length === 0){

    container.innerHTML = `

      <div style="
        text-align:center;
        padding:30px;
        color:#888;
      ">

        আপনার Cart খালি আছে 🛒

      </div>

    `;


    count.textContent =
      "0";


    document.getElementById(
      "cartTotal"
    ).textContent =
      "৳0";


    updateOrderSummary();

    return;

  }


  let totalQty = 0;

  let total = 0;


  container.innerHTML =

    cart.map(
      (item,index) => {

        totalQty +=
          item.qty;

        total +=
          item.price *
          item.qty;


        return `

          <div style="
            display:flex;
            gap:10px;
            padding:12px 0;
            border-bottom:1px solid #eee;
          ">

            <img
              src="${escapeAttribute(item.image)}"
              style="
                width:55px;
                height:55px;
                object-fit:cover;
                border-radius:6px;
              "
            >


            <div style="flex:1;">

              <div style="
                font-size:11px;
                font-weight:bold;
              ">

                ${escapeHTML(item.name)}

              </div>


              <div style="
                color:#00a950;
                font-size:12px;
                margin:4px 0;
              ">

                ৳${item.price}

              </div>


              <div style="
                display:flex;
                align-items:center;
                gap:8px;
              ">

                <button
                  onclick="changeQuantity(${index},-1)"
                  style="
                    width:25px;
                    height:25px;
                    border:none;
                    border-radius:5px;
                    background:#111827;
                    color:white;
                  "
                >
                  −
                </button>


                <span>
                  ${item.qty}
                </span>


                <button
                  onclick="changeQuantity(${index},1)"
                  style="
                    width:25px;
                    height:25px;
                    border:none;
                    border-radius:5px;
                    background:#111827;
                    color:white;
                  "
                >
                  +
                </button>


                <button
                  onclick="removeCartItem(${index})"
                  style="
                    border:none;
                    background:none;
                    color:red;
                    font-size:10px;
                  "
                >
                  Remove
                </button>

              </div>

            </div>

          </div>

        `;

      }
    ).join("");


  count.textContent =
    totalQty;


  document.getElementById(
    "cartTotal"
  ).textContent =
    "৳" + total;


  updateOrderSummary();

}


/* =========================
   QUANTITY
========================= */

window.changeQuantity =
function(index,change){

  if(!cart[index]){

    return;

  }


  const product =
    productsList.find(
      item =>
        item.id ===
        cart[index].id
    );


  if(change > 0){

    if(
      cart[index].qty >=
      product.stock
    ){

      showToast(
        "এর বেশি Stock নেই"
      );

      return;

    }

  }


  cart[index].qty +=
    change;


  if(
    cart[index].qty < 1
  ){

    cart.splice(
      index,
      1
    );

  }


  renderCart();

};


/* =========================
   REMOVE
========================= */

window.removeCartItem =
function(index){

  cart.splice(
    index,
    1
  );


  renderCart();


  showToast(
    "Product Cart থেকে Remove করা হয়েছে"
  );

};


/* =========================
   ORDER SUMMARY
========================= */

function updateOrderSummary(){

  const box =
    document.getElementById(
      "orderSummary"
    );


  if(!box){

    return;

  }


  if(cart.length === 0){

    box.innerHTML =
      "🛒 Cart খালি আছে";

    return;

  }


  const subtotal =
    cart.reduce(
      (sum,item) =>
        sum +
        (
          item.price *
          item.qty
        ),
      0
    );


  const area =
    document.getElementById(
      "deliveryArea"
    )?.value ||
    "inside";


  const delivery =
    area === "inside"
    ? 70
    : 130;


  const total =
    subtotal +
    delivery;


  const productsText =
    cart.map(
      item => `

        ${escapeHTML(item.name)}
        × ${item.qty}
        = ৳${item.price * item.qty}

      `
    ).join("<br>");


  box.innerHTML = `

    <b>
      আপনার অর্ডার:
    </b>

    <br><br>

    ${productsText}

    <hr style="
      border:none;
      border-top:1px solid #344054;
      margin:10px 0;
    ">

    Subtotal:
    ৳${subtotal}

    <br>

    Delivery:
    ৳${delivery}

    <br>

    <b style="
      font-size:13px;
    ">

      Total:
      ৳${total}

    </b>

  `;

}


/* =========================
   CART OPEN
========================= */

window.openCart =
function(){

  document
    .getElementById(
      "cartPanel"
    )
    .classList.add("open");


  document
    .getElementById(
      "overlay"
    )
    .classList.add("show");

};


/* =========================
   CART CLOSE
========================= */

window.closeCart =
function(){

  document
    .getElementById(
      "cartPanel"
    )
    .classList.remove("open");


  document
    .getElementById(
      "overlay"
    )
    .classList.remove("show");

};


/* =========================
   CHECKOUT
========================= */

window.checkout =
function(){

  closeCart();

  scrollToSection(
    "order"
  );

};


/* =========================
   TOAST
========================= */

window.showToast =
function(message){

  const toast =
    document.getElementById(
      "toast"
    );


  if(!toast){

    return;

  }


  toast.textContent =
    message;


  toast.style.display =
    "block";


  setTimeout(
    ()=>{
      toast.style.display =
        "none";
    },
    3000
  );

};


/* =========================
   SECURITY
========================= */

function escapeHTML(value){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


function escapeAttribute(value){

  return escapeHTML(
    value
  );

}


/* =========================
   START
========================= */

await loadCategories();

await loadProducts();

renderCart();

</script>
